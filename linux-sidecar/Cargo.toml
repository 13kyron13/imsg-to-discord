[package]
name = "imsg-to-discord-linux-sidecar"
version = "0.1.0"
edition = "2021"
description = "Linux x86_64 iMessage backend sidecar for imsg-to-discord"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt-multi-thread"] }

# The direct iMessage implementation will be enabled once the rustpush
# integration is completed. Keep it out of the default build while the
# sidecar protocol is stabilized.
rustpush = { git = "https://github.com/OpenBubbles/rustpush", rev = "f35c4ee062b3c3eae54dc96b89b90ee99f5e1d0c", optional = true }

[features]
default = []
direct-imessage = ["dep:rustpush"]
