[package]
name = "imsg-to-discord-linux-sidecar"
version = "0.1.0"
edition = "2021"
description = "Linux x86_64 iMessage backend sidecar for imsg-to-discord"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt-multi-thread"] }

[features]
default = []
